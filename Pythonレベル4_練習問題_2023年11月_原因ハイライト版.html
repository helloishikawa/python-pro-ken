<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python レベル4 練習問題（2023年11月）</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#fff; --ink:#1f2933; --sub:#52606d; --line:#dfe3e8; --accent:#3b6ef5;
    --ok-bg:#e6f6ec; --ok-ink:#1a7f45; --ok-line:#7bcf9a;
    --ng-bg:#fdecec; --ng-ink:#c0392b; --ng-line:#f0a9a1;
    --code-bg:#2b2f3a; --code-ink:#f2f4f8;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 14px 60px; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; line-height:1.7; }
  .wrap { max-width:820px; margin:0 auto; }
  header h1 { font-size:1.2rem; margin:0 0 4px; }
  header p { margin:0 0 14px; color:var(--sub); font-size:.82rem; }
  .progress-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; position:sticky; top:0;
    background:var(--bg); padding:8px 0; z-index:5; }
  .progress-text { font-size:.85rem; font-weight:700; color:var(--sub); white-space:nowrap; }
  .bar { flex:1; height:9px; background:#e3e8f0; border-radius:999px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .25s; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; box-shadow:0 1px 3px rgba(30,40,60,.05); }
  .qhead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .qno { background:var(--accent); color:#fff; font-size:.78rem; font-weight:700; padding:2px 10px; border-radius:999px; }
  .qtype { background:#eef1f6; color:var(--sub); font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; }
  .qtext { font-weight:700; margin:0 0 8px; white-space:pre-wrap; }
  .qexample { background:#f7f9fc; border:1px dashed var(--line); border-radius:8px; padding:8px 12px;
    margin:6px 0 14px; font-size:.9rem; color:#37414d; white-space:pre-wrap; }
  .qnote { font-size:.8rem; color:var(--sub); margin:2px 0 12px; white-space:pre-wrap; }
  .choice { display:block; width:100%; text-align:left; cursor:pointer; background:#fff;
    border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px;
    font:inherit; color:inherit; transition:border-color .15s,background .15s; }
  .choice:hover:not(:disabled) { border-color:var(--accent); }
  .choice .label { font-weight:700; margin-right:8px; color:var(--sub); }
  pre { margin:6px 0 0; background:var(--code-bg); color:var(--code-ink); padding:11px 13px;
    border-radius:8px; overflow-x:auto; font-family:"Consolas","SFMono-Regular","Menlo",monospace;
    font-size:.86rem; line-height:1.5; }
  pre .cline { display:block; white-space:pre; }
  pre .cline:empty::after { content:"\00a0"; }
  pre .cline.bad { background:rgba(224,80,70,.34); border-radius:3px; box-shadow:0 0 0 1px rgba(224,80,70,.5) inset; }
  pre .cline.bad .mk { color:#ffc7c2; font-size:.82em; }
  .choice.correct { background:var(--ok-bg); border-color:var(--ok-line); }
  .choice.wrong { background:var(--ng-bg); border-color:var(--ng-line); }
  .choice:disabled { cursor:default; }
  .why { display:none; margin:5px 2px 12px; padding:9px 12px; border-radius:8px;
    font-size:.88rem; border:1px solid var(--line); }
  .why.show { display:block; }
  .why.ok { background:var(--ok-bg); border-color:var(--ok-line); color:#155a33; }
  .why.ng { background:var(--ng-bg); border-color:var(--ng-line); color:#8f2c20; }
  .why b { font-weight:800; }
  .why code, .line code, .qtext code, .qnote code { background:#2b2f3a; color:#f2f4f8; padding:1px 6px; border-radius:5px;
    font-family:"Consolas","Menlo",monospace; font-size:.85em; }
  .result { margin-top:6px; display:none; }
  .result.show { display:block; }
  .badge { font-weight:800; font-size:1.05rem; margin-bottom:10px; }
  .badge.ok { color:var(--ok-ink); } .badge.ng { color:var(--ng-ink); }
  .explain { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .explain .head { background:#eef1f6; padding:8px 12px; font-weight:700; font-size:.88rem; }
  .lines { margin:0; padding:6px 0; }
  .line { display:flex; gap:10px; padding:6px 12px; font-size:.9rem; flex-wrap:wrap; }
  .line code { white-space:pre; padding:2px 7px; }
  .line span { color:var(--sub); flex:1; min-width:180px; }
  .postnote { margin-top:12px; background:#fff7e6; border:1px solid #f0d79a; color:#8a6316;
    border-radius:8px; padding:9px 12px; font-size:.83rem; }
  .reveal-btn { font:inherit; font-weight:700; padding:11px 22px; border-radius:10px; cursor:pointer;
    border:1.5px solid var(--accent); background:var(--accent); color:#fff; margin-top:6px; }
  .nav { display:flex; justify-content:space-between; margin-top:16px; gap:10px; }
  button.nav-btn { font:inherit; font-weight:700; padding:11px 20px; border-radius:10px; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--sub); }
  button.nav-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.nav-btn:disabled { opacity:.4; cursor:default; }
  .final { text-align:center; padding:36px 18px; }
  .final .score { font-size:2.3rem; font-weight:800; color:var(--accent); margin:10px 0; }
  .final .msg { color:var(--sub); margin-bottom:22px; }
  .jump { margin-top:10px; font-size:.8rem; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>プログラミング能力検定 Python レベル4 練習問題（2023年11月）</h1>
    <p>2023年11月検定 過去問題（全26問）／ 選択肢を選ぶと ◯✕・各選択肢の理由・正解コードの1行解説が出ます</p>
  </header>

  <div class="progress-row">
    <span class="progress-text" id="ptext">1 / 26 問</span>
    <div class="bar"><div id="pbar"></div></div>
  </div>

  <div id="stage"></div>

  <div class="nav" id="nav">
    <button class="nav-btn" id="backBtn" onclick="goBack()">← 戻る</button>
    <button class="nav-btn primary" id="nextBtn" onclick="goNext()" disabled>次へ →</button>
  </div>
  <div class="jump">問題番号をクリックで移動：<span id="jumpNums"></span></div>
</div>

<script>
const LABELS = ['①','②','③','④'];

const QUIZ = [
/* 1 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  note:'※ <code>const.XXXX</code> は定数として値を定義するコードである',
  example:'数学の勉強をします\n3時間勉強しました',
  choices:[
    {code:'import const\n\nconst.SUBJECT = "数学"\nconst.STUDY_TIME = 0\n\nprint(const.SUBJECT + "の勉強をします")\nconst.STUDY_TIME = const.STUDY_TIME + 3\nprint(str(const.STUDY_TIME) + "時間勉強しました")',correct:false,
     why:'<b>✕</b> 増えていく勉強時間を定数 <code>const.STUDY_TIME</code> にして<b>書き換えている</b>のでエラー。'},
    {code:'import const\n\nconst.SUBJECT = "数学"\nstudy_time = 0\n\nprint(const.SUBJECT + "の勉強をします")\nstudy_time = study_time + 3\nprint(str(study_time) + "時間勉強しました")',correct:true,
     why:'<b>◯ 正解。</b> 変わらない科目は定数、増えていく時間は普通の変数。'}
  ],
  explainTitle:'正解②のコードを1行ずつ',
  explainLines:[
    ['const.SUBJECT = "数学"','科目は変わらないので定数。'],
    ['study_time = 0','勉強時間は増えるので普通の変数。'],
    ['study_time = study_time + 3','3時間足す（普通の変数なのでOK）。'],
    ['print(str(study_time) + "時間勉強しました")','「3時間勉強しました」。']
  ]
},
/* 2 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  example:'インドは世界で一番人口が多い国です\nロシアは世界で一番面積が広い国です\nその国についてはよくわかりません\nエジプトは世界で一番長いナイル川が流れている国です',
  choices:[
    {code:'def introduce_country(country_name):\n    match:\n        case "インド":\n            introduction = "インドは世界で一番人口が多い国です"\n        case "ロシア":\n            introduction = "ロシアは世界で一番面積が広い国です"\n        case "エジプト":\n            introduction = "エジプトは世界で一番長いナイル川が流れている国です"\n        case _:\n            introduction = "その国についてはよくわかりません"\n\n    return introduction\n\ncountries = ["インド", "ロシア", "プロ検国", "エジプト"]\n\nfor country in countries:\n    print(introduce_country(country))',correct:false,
     why:'<b>✕</b> <code>match:</code> の後ろに調べる値が無い → 構文エラー。'},
    {code:'def introduce_country(country_name):\n    match country_name:\n        "インド":\n            introduction = "インドは世界で一番人口が多い国です"\n        "ロシア":\n            introduction = "ロシアは世界で一番面積が広い国です"\n        "エジプト":\n            introduction = "エジプトは世界で一番長いナイル川が流れている国です"\n        _:\n            introduction = "その国についてはよくわかりません"\n\n    return introduction\n\ncountries = ["インド", "ロシア", "プロ検国", "エジプト"]\n\nfor country in countries:\n    print(introduce_country(country))',correct:false,
     why:'<b>✕</b> 分かれ道に <code>case</code> が無い → 構文エラー。'},
    {code:'def introduce_country(country_name):\n    match country_name:\n        case "インド":\n            introduction = "インドは世界で一番人口が多い国です"\n        case "ロシア":\n            introduction = "ロシアは世界で一番面積が広い国です"\n        case "エジプト":\n            introduction = "エジプトは世界で一番長いナイル川が流れている国です"\n        case _:\n            introduction = "その国についてはよくわかりません"\n\n    return introduction\n\ncountries = ["インド", "ロシア", "プロ検国", "エジプト"]\n\nfor country in countries:\n    print(introduce_country(country))',correct:true,
     why:'<b>◯ 正解。</b> <code>match country_name:</code> と <code>case</code> の正しい形。プロ検国は <code>case _:</code> に入る。'}
  ],
  explainTitle:'正解③のコードを1行ずつ',
  explainLines:[
    ['def introduce_country(country_name):','国名から紹介文を作る関数。'],
    ['    match country_name:','国名で分かれる。'],
    ['        case _:','どれにも当てはまらない国（プロ検国）は「よくわかりません」。'],
    ['    return introduction','作った紹介文を返す。'],
    ['    print(introduce_country(country))','1か国ずつ表示。']
  ]
},
/* 3 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  note:'※ <code>len(arr)</code> 配列の長さ ／ <code>arr.pop(num)</code> num番目を消去',
  example:'3時間使用しました\n2時間だけ充電を行います\n1時間使用しました\n電池の残量は以下の通りです\n60%',
  choices:[
    {code:'battery_power = 100\nusage_times = [3, 1]\n\nif len(usage_times) > 0:\n    print(str(usage_times[0]) + "時間使用しました")\n    battery_power = battery_power - 20 * usage_times[0]\n    usage_times.pop(0)\n    if battery_power <= 50:\n        print("2時間だけ充電を行います")\n        battery_power = battery_power + 40\n\nprint("電池の残量は以下の通りです")\nprint(str(battery_power) + "%")',correct:false,
     why:'<b>✕</b> <code>if</code> は1回だけ。「1時間使用しました」まで進まず、残量は80%になる。'},
    {code:'battery_power = 100\nusage_times = [3, 1]\n\nwhile len(usage_times) > 0:\n    print(str(usage_times[0]) + "時間使用しました")\n    battery_power = battery_power - 20 * usage_times[0]\n    usage_times.pop(0)\n    if battery_power <= 50:\n        print("2時間だけ充電を行います")\n        battery_power = battery_power + 40\n\nprint("電池の残量は以下の通りです")\nprint(str(battery_power) + "%")',correct:true,
     why:'<b>◯ 正解。</b> 100→40（充電で80）→60。使用時間が無くなるまで <code>while</code> でくり返す。'},
    {code:'battery_power = 100\nusage_times = [3, 1]\n\nfor len(usage_times) > 0:\n    print(str(usage_times[0]) + "時間使用しました")\n    battery_power = battery_power - 20 * usage_times[0]\n    usage_times.pop(0)\n    if battery_power <= 50:\n        print("2時間だけ充電を行います")\n        battery_power = battery_power + 40\n\nprint("電池の残量は以下の通りです")\nprint(str(battery_power) + "%")',correct:false,
     why:'<b>✕</b> 条件でくり返すのは <code>while</code>。<code>for 条件:</code> は構文エラー。'},
    {code:'battery_power = 100\nusage_times = [3, 1]\n\nwhile:\n    print(str(usage_times[0]) + "時間使用しました")\n    battery_power = battery_power - 20 * usage_times[0]\n    usage_times.pop(0)\n    if battery_power <= 50:\n        print("2時間だけ充電を行います")\n        battery_power = battery_power + 40\n\nprint("電池の残量は以下の通りです")\nprint(str(battery_power) + "%")',correct:false,
     why:'<b>✕</b> <code>while:</code> に条件が無い → 構文エラー。'}
  ],
  explainTitle:'正解②のコードを1行ずつ',
  explainLines:[
    ['while len(usage_times) > 0:','使用時間が残っている間くり返す。'],
    ['    battery_power = battery_power - 20 * usage_times[0]','1時間で20%減る（3時間→100-60=40）。'],
    ['    usage_times.pop(0)','使った分を消す。'],
    ['    if battery_power <= 50:','50%以下なら…'],
    ['        battery_power = battery_power + 40','充電して40%増やす（40→80）。'],
    ['print(str(battery_power) + "%")','最後は 80-20=60%。']
  ]
},
/* 4 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  note:'※ <code>len(arr)</code> 配列の長さ ／ <code>arr.pop(num)</code> num番目を消去',
  example:'数学の勉強が終わりました\n理科は勉強しません\n英語の勉強が終わりました',
  choices:[
    {code:'import const\n\nsubject_list = ["数学", "理科", "英語"]\nstudy_time_list = [3, 2, 1]\nfree_time = 4\n\nwhile len(subject_list) > 0:\n    if free_time >= study_time_list[0]:\n        print(subject_list[0] + "の勉強が終わりました")\n        free_time = free_time - study_time_list[0]\n    else:\n        print(subject_list[0] + "は勉強しません")\n    subject_list.pop(0)\n    study_time_list.pop(0)',correct:true,
     why:'<b>◯ 正解。</b> 空き時間4→数学3時間で1→理科2時間は足りない→英語1時間で0。'},
    {code:'import const\n\nsubject_list = ["数学", "理科", "英語"]\nstudy_time_list = [3, 2, 1]\nfree_time = 4\n\nif len(subject_list) > 0:\n    if free_time >= study_time_list[0]:\n        print(subject_list[0] + "の勉強が終わりました")\n        free_time = free_time - study_time_list[0]\n    else:\n        print(subject_list[0] + "は勉強しません")\n    subject_list.pop(0)\n    study_time_list.pop(0)',correct:false,
     why:'<b>✕</b> <code>if</code> は1回だけなので、数学の1行しか出ない。'},
    {code:'import const\n\nsubject_list = ["数学", "理科", "英語"]\nstudy_time_list = [3, 2, 1]\nconst.FREE_TIME = 4\n\nif len(subject_list) > 0:\n    if const.FREE_TIME >= study_time_list[0]:\n        print(subject_list[0] + "の勉強が終わりました")\n        const.FREE_TIME = const.FREE_TIME - study_time_list[0]\n    else:\n        print(subject_list[0] + "は勉強しません")\n    subject_list.pop(0)\n    study_time_list.pop(0)',correct:false,
     why:'<b>✕</b> 1回だけのうえ、減っていく空き時間を定数にして書き換えている → エラー。'},
    {code:'import const\n\nsubject_list = ["数学", "理科", "英語"]\nstudy_time_list = [3, 2, 1]\nconst.FREE_TIME = 4\n\nwhile len(subject_list) > 0:\n    if const.FREE_TIME >= study_time_list[0]:\n        print(subject_list[0] + "の勉強が終わりました")\n        const.FREE_TIME = const.FREE_TIME - study_time_list[0]\n    else:\n        print(subject_list[0] + "は勉強しません")\n    subject_list.pop(0)\n    study_time_list.pop(0)',correct:false,
     why:'<b>✕</b> while は正しいが、定数 <code>const.FREE_TIME</code> を書き換えている → エラー。'}
  ],
  explainTitle:'正解①のコードを1行ずつ',
  explainLines:[
    ['free_time = 4','空き時間（減るので普通の変数）。'],
    ['while len(subject_list) > 0:','科目が残っている間。'],
    ['    if free_time >= study_time_list[0]:','時間が足りれば勉強して…'],
    ['        free_time = free_time - study_time_list[0]','空き時間を減らす。'],
    ['    else:','足りなければ「勉強しません」。'],
    ['    subject_list.pop(0)','先頭の科目と時間を消して次へ。']
  ]
},
/* 5 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  example:'ミクさんが発表を行いました\nケンさんは本日欠席です\nシュウさんが発表を行いました',
  choices:[
    {code:'people = ["ミク", "ケン", "シュウ"]\nabsentee = "ケン"\n\nfor person in people:\n    if person == absentee:\n        print(person + "さんは本日欠席です")\n        continue\n    print(person + "さんが発表を行いました")',correct:true,
     why:'<b>◯ 正解。</b> 欠席者は表示して <code>continue</code>（発表の行をとばす）。'},
    {code:'people = ["ミク", "ケン", "シュウ"]\nabsentee = "ケン"\n\nfor person in people:\n    if person == absentee:\n        print(person + "さんは本日欠席です")\n        break\n    print(person + "さんが発表を行いました")',correct:false,
     why:'<b>✕</b> <code>break</code> だとケンで終わり、シュウが出ない。'},
    {code:'people = ["ミク", "ケン", "シュウ"]\nabsentee = "ケン"\n\nfor person in people:\n    if person == absentee:\n        print(person + "さんは本日欠席です")\n    print(person + "さんが発表を行いました")',correct:false,
     why:'<b>✕</b> とばしていないので「ケンさんが発表を行いました」まで出てしまう。'}
  ],
  explainTitle:'正解①のコードを1行ずつ',
  explainLines:[
    ['for person in people:','1人ずつ。'],
    ['    if person == absentee:','欠席者なら…'],
    ['        continue','「欠席です」と表示して、発表の行をとばす。'],
    ['    print(person + "さんが発表を行いました")','ほかの人は発表。']
  ]
},
/* 6 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  note:'※ <code>const.XXXX</code> は定数として値を定義するコードである',
  example:'状態: 作業中\n状態: 冷却中\n状態: 待機中\n機械は停止しています',
  choices:[
    {code:'import const\n\nactivities = ["作業中", "冷却中", "待機中"]\nconst.MESSAGE = ""\n\nfor activity in activities:\n    const.MESSAGE = "状態: " + activity\n    print(const.MESSAGE)\n    if activity != "待機中":\n        continue\n    print("機械は停止しています")',correct:false,
     why:'<b>✕</b> 変わっていく表示文を定数 <code>const.MESSAGE</code> にして書き換えている → エラー。'},
    {code:'import const\n\nactivities = ["作業中", "冷却中", "待機中"]\nmessage = ""\n\nfor activity in activities:\n    message = "状態: " + activity\n    print(message)\n    if activity != "待機中":\n        break\n    print("機械は停止しています")',correct:false,
     why:'<b>✕</b> <code>break</code> だと「作業中」のところで終わってしまう。'},
    {code:'import const\n\nactivities = ["作業中", "冷却中", "待機中"]\nmessage = ""\n\nfor activity in activities:\n    message = "状態: " + activity\n    print(message)\n    if activity != "待機中":\n        continue\n    print("機械は停止しています")',correct:true,
     why:'<b>◯ 正解。</b> 待機中<b>以外</b>は <code>continue</code> でとばし、待機中のときだけ「停止しています」。'},
    {code:'import const\n\nactivities = ["作業中", "冷却中", "待機中"]\nconst.MESSAGE = ""\n\nfor activity in activities:\n    const.MESSAGE = "状態: " + activity\n    print(const.MESSAGE)\n    if activity != "待機中":\n        break\n    print("機械は停止しています")',correct:false,
     why:'<b>✕</b> 定数の書き換え（エラー）＋ break で止まる。'}
  ],
  explainTitle:'正解③のコードを1行ずつ',
  explainLines:[

let current = 0;
let writtenAnswer = '';
function tabKey(e,el){
  if(e.key!=='Tab') return;
  e.preventDefault();
  const p=el.selectionStart;
  el.value=el.value.slice(0,p)+'    '+el.value.slice(el.selectionEnd);
  el.selectionStart=el.selectionEnd=p+4;
  writtenAnswer=el.value;
}
const answered = new Array(QUIZ.length).fill(null);   // 選択式:選んだ番号 / 記述式:"revealed"

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* コードを1行ずつ描画。答えた後は「原因の行」を赤くハイライト。 */
function renderCodeHtml(code, badLines, done){
  const lines = code.split('\n');
  let h = '<pre>';
  lines.forEach(function(ln){
    const isBad = done && badLines.indexOf(ln.trim()) !== -1 && ln.trim() !== '';
    h += '<span class="cline'+(isBad?' bad':'')+'">'+esc(ln)+(isBad?'<span class="mk">  ← ここが原因</span>':'')+'</span>';
  });
  h += '</pre>';
  return h;
}

function render(){
  if(current >= QUIZ.length){ renderFinal(); return; }
  const item = QUIZ[current];
  const isWritten = item.type === 'written';
  const picked = answered[current];
  const done = picked !== null;

  let html = '<div class="card">';
  html += '<div class="qhead"><span class="qno">第' + (current+1) + '問</span>';
  html += '<span class="qtype">' + (isWritten ? '記述式' : '選択式') + '</span></div>';
  html += '<div class="qtext">' + item.q + '</div>';
  if(item.constraint) html += '<div class="qnote">' + item.constraint + '</div>';
  if(item.example) html += '<div class="qexample">【出力例】\n' + esc(item.example) + '</div>';
  if(item.note) html += '<div class="qnote">' + item.note + '</div>';
  if(item.qcode) html += '<div class="qnote" style="margin-bottom:4px;">プログラム：</div><pre id="qcodePre" style="margin-bottom:14px;"></pre>';

  if(isWritten){
    html += '<div class="qnote" style="margin-bottom:4px;">問題プログラム：</div>';
    html += '<pre id="givenPre"></pre>';
    html += '<div class="qnote" style="margin:14px 0 4px;">✏️ 解答欄（ここに関数を書いてみよう）：</div>';
    html += '<textarea id="writtenBox" spellcheck="false" placeholder="例）def ...." style="width:100%;min-height:110px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:Consolas,Menlo,monospace;font-size:.9rem;line-height:1.5;resize:vertical;" oninput="writtenAnswer=this.value" onkeydown="tabKey(event,this)"></textarea>';
    if(!done){
      html += '<div style="margin-top:12px;"><button class="reveal-btn" onclick="reveal()">解答例を見る</button></div>';
    }
    html += '<div class="result ' + (done?'show':'') + '" style="margin-top:14px;">';
    html += '<div class="qnote" style="margin-bottom:4px;">解答例（自分の答えと見比べよう）：</div>';
    html += '<pre id="ansPre"></pre>';
    html += buildExplain(item);
    html += '</div>';
  } else {
    item.choices.forEach(function(c,i){
      let cls='choice';
      if(done){
        if(i===picked) cls += c.correct?' correct':' wrong';
        else if(c.correct) cls += ' correct';
      }
      const badLines = (BAD[current] && BAD[current][i]) ? BAD[current][i] : [];
      html += '<button class="'+cls+'" '+(done?'disabled':'')+' onclick="pick('+i+')"><span class="label">'+LABELS[i]+'</span>'+renderCodeHtml(c.code, badLines, done)+'</button>';
      html += '<div class="why '+(c.correct?'ok':'ng')+(done?' show':'')+'">'+c.why+'</div>';
    });
    html += '<div class="result '+(done?'show':'')+'">';
    const ci = item.choices.findIndex(function(c){return c.correct;});
    const right = done && picked===ci;
    html += '<div class="badge '+(right?'ok':'ng')+'">'+(done?(right?'◯ 正解！':'✕ 残念、不正解（正解は'+LABELS[ci]+'）'):'')+'</div>';
    html += buildExplain(item);
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('stage').innerHTML = html;

  // 記述式のコードは textContent で（選択式のコードは renderCodeHtml で描画済み）
  if(isWritten){
    document.getElementById('givenPre').textContent = item.givenCode;
    document.getElementById('writtenBox').value = writtenAnswer;
    if(document.getElementById('ansPre')) document.getElementById('ansPre').textContent = item.answerCode;
  }
  if(item.qcode) document.getElementById('qcodePre').textContent = item.qcode;
  const codes = document.querySelectorAll('#stage .line code');
  item.explainLines.forEach(function(l,i){ if(codes[i]) codes[i].textContent = l[0]; });

  document.getElementById('ptext').textContent = (current+1)+' / '+QUIZ.length+' 問';
  document.getElementById('pbar').style.width = ((current+1)/QUIZ.length*100)+'%';
  document.getElementById('backBtn').disabled = (current===0);
  const nb = document.getElementById('nextBtn');
  nb.disabled = !done;
  nb.textContent = (current===QUIZ.length-1)?'結果を見る →':'次へ →';
  updateJump();
}

function buildExplain(item){
  let h = '<div class="explain"><div class="head">'+item.explainTitle+'</div><div class="lines">';
  item.explainLines.forEach(function(l){
    h += '<div class="line"><code></code><span>'+l[1]+'</span></div>';
  });
  h += '</div></div>';
  if(item.postNote) h += '<div class="postnote">'+item.postNote+'</div>';
  return h;
}

function pick(i){
  if(answered[current]!==null) return;
  answered[current]=i;
  render();
}
function reveal(){
  answered[current]='revealed';
  render();
}
function goNext(){ if(answered[current]===null) return; current++; render(); }
function goBack(){ if(current>0){ current--; render(); } }

function updateJump(){
  const el = document.getElementById('jumpNums');
  let s='';
  for(let i=0;i<QUIZ.length;i++){
    const mark = answered[i]!==null ? '●' : '○';
    const style = i===current ? 'font-weight:800;color:var(--accent);' : 'color:var(--sub);';
    s += '<a href="#" onclick="jumpTo('+i+');return false;" style="text-decoration:none;margin:0 3px;'+style+'">'+(i+1)+'</a>';
  }
  el.innerHTML = s;
}
function jumpTo(i){ current=i; render(); window.scrollTo(0,0); }

function renderFinal(){
  let score=0;
  QUIZ.forEach(function(item,qi){
    if(item.type==='written') return;
    const ci=item.choices.findIndex(function(c){return c.correct;});
    if(answered[qi]===ci) score++;
  });
  document.getElementById('ptext').textContent='結果';
  document.getElementById('pbar').style.width='100%';
  document.getElementById('nav').style.display='none';
  const perfect = score===scoredCount;
  document.getElementById('stage').innerHTML =
    '<div class="card final">'+
    '<div>おつかれさまでした！</div>'+
    '<div class="score">'+score+' / '+scoredCount+' 問 正解</div>'+
    '<div class="msg">'+(perfect?'全問正解！すばらしい🎉':'まちがえた問題は、下の番号や「戻る」で見直せます。')+'<br>（第26問は記述式のため採点には含みません）</div>'+
    '<button class="nav-btn primary" onclick="restart()">もう一度やる</button>'+
    '</div>';
  updateJump();
  document.getElementById('nav').style.display='flex';
  document.getElementById('backBtn').disabled=false;
  document.getElementById('nextBtn').disabled=true;
  document.getElementById('nextBtn').textContent='結果を見る →';
}
function restart(){ writtenAnswer=''; current=0; for(let i=0;i<answered.length;i++) answered[i]=null; render(); window.scrollTo(0,0); }

render();
</script>
