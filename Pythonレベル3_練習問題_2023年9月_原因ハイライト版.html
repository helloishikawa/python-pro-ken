<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プログラミング能力検定 Python レベル3 練習問題</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#fff; --ink:#1f2933; --sub:#52606d; --line:#dfe3e8; --accent:#3b6ef5;
    --ok-bg:#e6f6ec; --ok-ink:#1a7f45; --ok-line:#7bcf9a;
    --ng-bg:#fdecec; --ng-ink:#c0392b; --ng-line:#f0a9a1;
    --code-bg:#2b2f3a; --code-ink:#f2f4f8;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 14px 60px; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; line-height:1.7; }
  .wrap { max-width:820px; margin:0 auto; }
  header h1 { font-size:1.2rem; margin:0 0 4px; }
  header p { margin:0 0 14px; color:var(--sub); font-size:.82rem; }
  .progress-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; position:sticky; top:0;
    background:var(--bg); padding:8px 0; z-index:5; }
  .progress-text { font-size:.85rem; font-weight:700; color:var(--sub); white-space:nowrap; }
  .bar { flex:1; height:9px; background:#e3e8f0; border-radius:999px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .25s; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; box-shadow:0 1px 3px rgba(30,40,60,.05); }
  .qhead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .qno { background:var(--accent); color:#fff; font-size:.78rem; font-weight:700; padding:2px 10px; border-radius:999px; }
  .qtype { background:#eef1f6; color:var(--sub); font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; }
  .qtext { font-weight:700; margin:0 0 8px; white-space:pre-wrap; }
  .qexample { background:#f7f9fc; border:1px dashed var(--line); border-radius:8px; padding:8px 12px;
    margin:6px 0 14px; font-size:.9rem; color:#37414d; white-space:pre-wrap; }
  .qnote { font-size:.8rem; color:var(--sub); margin:2px 0 12px; white-space:pre-wrap; }
  .choice { display:block; width:100%; text-align:left; cursor:pointer; background:#fff;
    border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px;
    font:inherit; color:inherit; transition:border-color .15s,background .15s; }
  .choice:hover:not(:disabled) { border-color:var(--accent); }
  .choice .label { font-weight:700; margin-right:8px; color:var(--sub); }
  pre { margin:6px 0 0; background:var(--code-bg); color:var(--code-ink); padding:11px 13px;
    border-radius:8px; overflow-x:auto; font-family:"Consolas","SFMono-Regular","Menlo",monospace;
    font-size:.86rem; line-height:1.5; }
  pre .cline { display:block; white-space:pre; }
  pre .cline:empty::after { content:"\00a0"; }
  pre .cline.bad { background:rgba(224,80,70,.34); border-radius:3px; box-shadow:0 0 0 1px rgba(224,80,70,.5) inset; }
  pre .cline.bad .mk { color:#ffc7c2; font-size:.82em; }
  .choice.correct { background:var(--ok-bg); border-color:var(--ok-line); }
  .choice.wrong { background:var(--ng-bg); border-color:var(--ng-line); }
  .choice:disabled { cursor:default; }
  .why { display:none; margin:5px 2px 12px; padding:9px 12px; border-radius:8px;
    font-size:.88rem; border:1px solid var(--line); }
  .why.show { display:block; }
  .why.ok { background:var(--ok-bg); border-color:var(--ok-line); color:#155a33; }
  .why.ng { background:var(--ng-bg); border-color:var(--ng-line); color:#8f2c20; }
  .why b { font-weight:800; }
  .why code, .line code, .qtext code, .qnote code { background:#2b2f3a; color:#f2f4f8; padding:1px 6px; border-radius:5px;
    font-family:"Consolas","Menlo",monospace; font-size:.85em; }
  .result { margin-top:6px; display:none; }
  .result.show { display:block; }
  .badge { font-weight:800; font-size:1.05rem; margin-bottom:10px; }
  .badge.ok { color:var(--ok-ink); } .badge.ng { color:var(--ng-ink); }
  .explain { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .explain .head { background:#eef1f6; padding:8px 12px; font-weight:700; font-size:.88rem; }
  .lines { margin:0; padding:6px 0; }
  .line { display:flex; gap:10px; padding:6px 12px; font-size:.9rem; flex-wrap:wrap; }
  .line code { white-space:pre; padding:2px 7px; }
  .line span { color:var(--sub); flex:1; min-width:180px; }
  .postnote { margin-top:12px; background:#fff7e6; border:1px solid #f0d79a; color:#8a6316;
    border-radius:8px; padding:9px 12px; font-size:.83rem; }
  .reveal-btn { font:inherit; font-weight:700; padding:11px 22px; border-radius:10px; cursor:pointer;
    border:1.5px solid var(--accent); background:var(--accent); color:#fff; margin-top:6px; }
  .nav { display:flex; justify-content:space-between; margin-top:16px; gap:10px; }
  button.nav-btn { font:inherit; font-weight:700; padding:11px 20px; border-radius:10px; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--sub); }
  button.nav-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.nav-btn:disabled { opacity:.4; cursor:default; }
  .final { text-align:center; padding:36px 18px; }
  .final .score { font-size:2.3rem; font-weight:800; color:var(--accent); margin:10px 0; }
  .final .msg { color:var(--sub); margin-bottom:22px; }
  .jump { margin-top:10px; font-size:.8rem; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>プログラミング能力検定 Python レベル3 練習問題</h1>
    <p>2023年9月検定 過去問題（全26問）／ 選択肢を選ぶと ◯✕・各選択肢の理由・正解コードの1行解説が出ます</p>
  </header>

  <div class="progress-row">
    <span class="progress-text" id="ptext">1 / 26 問</span>
    <div class="bar"><div id="pbar"></div></div>
  </div>

  <div id="stage"></div>

  <div class="nav" id="nav">
    <button class="nav-btn" id="backBtn" onclick="goBack()">← 戻る</button>
    <button class="nav-btn primary" id="nextBtn" onclick="goNext()" disabled>次へ →</button>
  </div>
  <div class="jump">問題番号をクリックで移動：<span id="jumpNums"></span></div>
</div>

<script>
const LABELS = ['①','②','③','④'];

const QUIZ = [
/* 1 */ {
  q:'「まだ焼けていません」と出力されるプログラムを選びなさい。',
  choices:[
    {code:'burning_condition = "True"\nif burning_condition:\n    print("上手に焼けました")\nelse:\n    print("まだ焼けていません")',correct:false,
     why:'<b>✕</b> <code>"True"</code>は文字列。Pythonでは<b>中身のある文字列は「真」</b>扱いなので<code>if</code>が成立し「上手に焼けました」が出ます。'},
    {code:'burning_condition = True\nif burning_condition:\n    print("上手に焼けました")\nelse:\n    print("まだ焼けていません")',correct:false,
     why:'<b>✕</b> <code>True</code>なので<code>if</code>が成立し「上手に焼けました」が出ます。'},
    {code:'burning_condition = False\nif burning_condition:\n    print("上手に焼けました")\nelse:\n    print("まだ焼けていません")',correct:true,
     why:'<b>◯ 正解。</b> <code>False</code>(偽)なので<code>if</code>は成立せず<code>else</code>へ進み「まだ焼けていません」が出ます。'},
    {code:'burning_condition = "False"\nif burning_condition:\n    print("上手に焼けました")\nelse:\n    print("まだ焼けていません")',correct:false,
     why:'<b>✕</b> <code>"False"</code>も文字列で中身があるため<b>「真」扱い</b>。<code>if</code>が成立し「上手に焼けました」が出ます。'}
  ],
  explainTitle:'正解③のコードを1行ずつ',
  explainLines:[
    ['burning_condition = False','変数に False（偽）を入れる。'],
    ['if burning_condition:','中身が偽なので、このifは成立しない。'],
    ['    print("上手に焼けました")','ifが成立しないので実行されない。'],
    ['else:','ifが成立しないときはelseへ。'],
    ['    print("まだ焼けていません")','だから「まだ焼けていません」と表示。これが答え。']
  ]
},
/* 2 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  example:'ロボットを動かします\n前進しました\n後退しました',
  choices:[
    {code:'def move_forward():\n    if True:\n        print("前進しました")\n    else:\n        print("動作できません")\n\ndef move_backward():\n    if True:\n        print("後退しました")\n    else:\n        print("動作できません")\n\nprint("ロボットを動かします")\nmove_forward()\nmove_backward()',correct:true,
     why:'<b>◯ 正解。</b> <code>def</code>で2つの関数を作り、最後に見出しを表示してから両方の関数を呼ぶので、3行が正しく出ます。'},
    {code:'move_forward():\n    if True:\n        print("前進しました")\n    else:\n        print("動作できません")\n\nmove_backward():\n    if True:\n        print("後退しました")\n    else:\n        print("動作できません")\n\nprint("ロボットを動かします")\nmove_forward()\nmove_backward()',correct:false,
     why:'<b>✕</b> 先頭に<code>def</code>が無いので関数を作れず、<b>構文エラー</b>になります。'}
  ],
  explainTitle:'正解①のコードを1行ずつ',
  explainLines:[
    ['def move_forward():','「前に進む」関数を作る。'],
    ['    if True:','条件は必ず真なので…'],
    ['        print("前進しました")','いつも「前進しました」と表示。'],
    ['def move_backward():','同じように「後ろに下がる」関数を作る。'],
    ['print("ロボットを動かします")','まず見出しを表示。'],
    ['move_forward()','前進の関数を呼ぶ→前進しました。'],
    ['move_backward()','後退の関数を呼ぶ→後退しました。']
  ]
},
/* 3 */ {
  q:'以下のように出力されるプログラムを選びなさい。',
  example:'合否を発表します\n合格です',
  choices:[
    {code:'def getResult():\n    if False:\n        print("合格です")\n    else:\n        print("不合格です")\n\nprint("合否を発表します")',correct:false,
     why:'<b>✕</b> 関数を作っただけで<code>getResult()</code>を<b>呼んでいない</b>ので、「合否を発表します」しか出ません。'},
    {code:'def getResult():\n    if True:\n        print("合格です")\n    else:\n        print("不合格です")\n\nprint("合否を発表します")\ngetResult()',correct:true,
     why:'<b>◯ 正解。</b> <code>if True</code>で「合格です」、最後に<code>getResult()</code>を呼ぶので両方出ます。'},
    {code:'def getResult():\n    if True:\n        print("合格です")\n    else:\n        print("不合格です")\n\nprint("合否を発表します")',correct:false,
     why:'<b>✕</b> ①と同じく<code>getResult()</code>の<b>呼び出しが無い</b>ので「合格です」が出ません。'},
    {code:'def getResult():\n    if False:\n        print("合格です")\n    else:\n        print("不合格です")\n\nprint("合否を発表します")\ngetResult()',correct:false,
     why:'<b>✕</b> 呼び出しはありますが<code>if False</code>なので<code>else</code>→「不合格です」になります。'}
  ],
  explainTitle:'正解②のコードを1行ずつ',
  explainLines:[
    ['def getResult():','合否を出す関数を作る。'],
    ['    if True:','条件が真なので…'],
    ['        print("合格です")','「合格です」と表示。'],
    ['print("合否を発表します")','まず見出しを表示。'],
    ['getResult()','関数を呼ぶ→「合格です」。この呼び出しが大事。']
  ]
},
/* 4 */ {
  q:'「収入1000円で税率が10%掛かる場合の納税額は100円です」と出力されるプログラムを選びなさい。',
  choices:[
    {code:'def say_tax_amount(income):\n    tax_amount = income * 0.1\n    print("収入" + str(income) + "円で税率が10%掛かる場合の納税額は" + str(tax_amount) + "円です")\n\nmy_income = 1000\n\nsay_tax_amount(my_income)',correct:true,
     why:'<b>◯ 正解。</b> 引数<code>income</code>を受け取り、<code>my_income</code>(1000)を渡して呼ぶので正しく計算・表示できます。'},
    {code:'def say_tax_amount(income):\n    tax_amount = income * 0.1\n    print("収入" + str(income) + "円で税率が10%掛かる場合の納税額は" + str(tax_amount) + "円です")\n\nmy_income = 1000\n\nsay_tax_amount()',correct:false,
     why:'<b>✕</b> <code>say_tax_amount()</code>と引数を渡していないので、<code>income</code>が無く<b>エラー</b>になります。'},
    {code:'def say_tax_amount(income):\n    tax_amount = income * 0.1\n    print("収入" + str(income) + "円で税率が10%掛かる場合の納税額は" + str(tax_amount) + "円です")\n\nmy_income = 1000\n\nsay_tax_amount(income)',correct:false,
     why:'<b>✕</b> <code>say_tax_amount(income)</code>の<code>income</code>という変数は存在しません（あるのは<code>my_income</code>）→<b>エラー</b>。'},
    {code:'def say_tax_amount(my_income):\n    tax_amount = income * 0.1\n    print("収入" + str(income) + "円で税率が10%掛かる場合の納税額は" + str(tax_amount) + "円です")\n\nmy_income = 1000\n\nsay_tax_amount(my_income)',correct:false,
     why:'<b>✕</b> 仮引数が<code>my_income</code>なのに中で<code>income</code>を使っているので、<code>income</code>が無く<b>エラー</b>。'}
  ],
  explainTitle:'正解①のコードを1行ずつ',
  explainLines:[
    ['def say_tax_amount(income):','収入incomeを受け取る関数を作る。'],
    ['    tax_amount = income * 0.1','収入の10%(0.1倍)を計算して納税額に。'],
    ['    print(...)','収入と納税額を文章にして表示。'],
    ['my_income = 1000','収入1000円を用意。'],
    ['say_tax_amount(my_income)','1000を渡して関数を実行→納税額を表示。']
  ],
  postNote:'補足：<code>1000 * 0.1</code> は Python では <code>100.0</code>（小数）になるため、実際の表示は「…納税額は100.0円です」になります。検定の想定解答は①です。'
},
/* 5 */ {
  q:'「このジェットコースターに乗れません」と出力されるプログラムを選びなさい。',
  choices:[
    {code:'def is_rideable():\n    if ((height > 120) and (height < 200)):\n        return "True"\n\n    return "False"\n\nif is_rideable(100):\n    print("このジェットコースターに乗れます")\nelse:\n    print("このジェットコースターに乗れません")',correct:false,
     why:'<b>✕</b> 引数<code>height</code>が無いのに<code>is_rideable(100)</code>と呼び、中の<code>height</code>も無い→<b>エラー</b>。返す値も文字列です。'},
    {code:'def is_rideable(height):\n    if ((height > 120) and (height < 200)):\n        return "True"\n\n    return "False"\n\nif is_rideable(100):\n    print("このジェットコースターに乗れます")\nelse:\n    print("このジェットコースターに乗れません")',correct:false,
     why:'<b>✕</b> <code>return "False"</code>は文字列。中身のある文字列は<b>真扱い</b>なので、100でも「乗れます」が出てしまいます。'},
    {code:'def is_rideable(height):\n    if ((height > 120) and (height < 200)):\n        return True\n\n    return False\n\nif is_rideable(100):\n    print("このジェットコースターに乗れます")\nelse:\n    print("このジェットコースターに乗れません")',correct:true,
     why:'<b>◯ 正解。</b> <code>True</code>/<code>False</code>(真偽値)を返します。100は120以下なので<code>False</code>→<code>else</code>→「乗れません」。'},
    {code:'def is_rideable():\n    if ((height > 120) and (height < 200)):\n        return True\n\n    return False\n\nif is_rideable(100):\n    print("このジェットコースターに乗れます")\nelse:\n    print("このジェットコースターに乗れません")',correct:false,
     why:'<b>✕</b> 引数<code>height</code>が無いのに<code>is_rideable(100)</code>と呼ぶ→<b>エラー</b>。'}
  ],
  explainTitle:'正解③のコードを1行ずつ',
  explainLines:[
    ['def is_rideable(height):','身長heightを受け取り、乗れるか判定する関数。'],
    ['    if ((height > 120) and (height < 200)):','身長が120より大きく200より小さいなら…'],
    ['        return True','乗れる(True)を返す。'],
    ['    return False','そうでなければ乗れない(False)を返す。'],
    ['if is_rideable(100):','身長100で判定→120以下なのでFalse。'],
    ['else:','Falseなのでelseへ。'],
    ['    print("...乗れません")','「乗れません」と表示。']
  ]
},
/* 6 */ {
  q:'「ログインしました」と出力されるプログラムを選びなさい。',
  choices:[
    {code:'def authenticate(password):\n    if (password == 1234):\n        return True\n    else:\n        return False\n\nentered_password = 1234\n\nif authenticate(entered_password):\n    print("ログインしました")\nelse:\n    print("パスワードが違います")',correct:true,
     why:'<b>◯ 正解。</b> 合っていれば<code>return True</code>を返します。1234が一致→True→「ログインしました」。'},
    {code:'def authenticate(password):\n    if (password == 1234):\n        False\n    else:\n        True\n\nentered_password = 1234\n\nif authenticate(entered_password):\n    print("ログインしました")\nelse:\n    print("パスワードが違います")',correct:false,
     why:'<b>✕</b> <code>True</code>/<code>False</code>に<code>return</code>が無いので関数は<code>None</code>(偽)を返す→「パスワードが違います」。'},
    {code:'def authenticate(password):\n    if (password == 1234):\n        True\n    else:\n        False\n\nentered_password = 1234\n\nif authenticate(entered_password):\n    print("ログインしました")\nelse:\n    print("パスワードが違います")',correct:false,
     why:'<b>✕</b> こちらも<code>return</code>が無く<code>None</code>を返す→「パスワードが違います」。'},
    {code:'def authenticate(password):\n    if (password == 1234):\n        return False\n    else:\n        return True\n\nentered_password = 1234\n\nif authenticate(entered_password):\n    print("ログインしました")\nelse:\n    print("パスワードが違います")',correct:false,
     why:'<b>✕</b> 一致したときに<code>return False</code>と逆を返しているので→「パスワードが違います」。'}
  ],
  explainTitle:'正解①のコードを1行ずつ',
  explainLines:[
    ['def authenticate(password):','パスワードを確認する関数。'],
    ['    if (password == 1234):','パスワードが1234と同じなら…'],
    ['        return True','合っている(True)を返す。'],
    ['    else:','ちがうなら…'],
    ['        return False','間違い(False)を返す。'],
    ['entered_password = 1234','入力されたパスワードは1234。'],
    ['if authenticate(entered_password):','確認→Trueが返る。'],
    ['    print("ログインしました")','Trueなので「ログインしました」と表示。']
  ]
},
/* 7 */ {
  q:'「住所2-3-12に配達依頼があります」と出力されるプログラムを選びなさい。',
  choices:[
    {code:'def deliver_info():\n    address = 2-3-12\n\n    print("住所" + address + "に配達依頼があります")\n\ndeliver_request = True\n\nif deliver_request:\n    deliver_info()',correct:false,
     why:'<b>✕</b> <code>address = 2-3-12</code>は<code>"</code>で囲んでおらず数字の引き算(=-13)。文字列と足せず<b>エラー</b>。'},
    {code:'def deliver_info():\n    address = "2-3-12"\n\n    print("住所" + address + "に配達依頼があります")\n\ndeliver_request = True\n\nif deliver_request:\n    deliver_info()',correct:true,
     why:'<b>◯ 正解。</b> <code>address = "2-3-12"</code>と文字列にし、関数を作って呼ぶので正しく表示できます。'},
    {code:'for deliver_info():\n    address = 2-3-12\n\n    print("住所" + address + "に配達依頼があります")\n\ndeliver_request = True\n\nif deliver_request:\n    deliver_info()',correct:false,
     why:'<b>✕</b> 先頭が<code>for deliver_info():</code>で関数の作り方が間違い→<b>構文エラー</b>。'},
    {code:'for deliver_info():\n    address = "2-3-12"\n\n    print("住所" + address + "に配達依頼があります")\n\ndeliver_request = True\n\nif deliver_request:\n    deliver_info()',correct:false,
     why:'<b>✕</b> ③と同じく<code>for</code>の使い方が間違いで<b>構文エラー</b>。'}
  ],
  explainTitle:'正解②のコードを1行ずつ',
  explainLines:[

/* ===== エンジン ===== */
let current = 0;
let writtenAnswer = '';
function tabKey(e,el){
  if(e.key!=='Tab') return;
  e.preventDefault();
  const p=el.selectionStart;
  el.value=el.value.slice(0,p)+'    '+el.value.slice(el.selectionEnd);
  el.selectionStart=el.selectionEnd=p+4;
  writtenAnswer=el.value;
}
const answered = new Array(QUIZ.length).fill(null);   // 選択式:選んだ番号 / 記述式:"revealed"
const scoredCount = QUIZ.filter(function(x){return x.type!=='written';}).length;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 不正解の選択肢で「原因の行」を指定（問題index → 選択肢index → その行の文字列） */
const BAD = {
  0:{0:['burning_condition = "True"'],1:['burning_condition = True'],3:['burning_condition = "False"']},
  1:{1:['move_forward():','move_backward():']},
  2:{3:['if False:']},
  3:{1:['say_tax_amount()'],2:['say_tax_amount(income)'],3:['def say_tax_amount(my_income):','tax_amount = income * 0.1']},
  4:{0:['def is_rideable():'],1:['return "True"','return "False"'],3:['def is_rideable():']},
  5:{1:['False','True'],2:['True','False'],3:['return False','return True']},
  6:{0:['address = 2-3-12'],2:['for deliver_info():'],3:['for deliver_info():']},
  7:{0:['outdoor_staff = "22"','indoor_staff = "10"'],1:['def calculate_total_staff():'],2:['def calculate_total_staff():']},
  8:{0:['files = ["5", "10", "20"]'],1:['"USBの使用可能容量を超えています"','"USBの使用可能容量以内です"'],3:['files = ["5", "10", "20"]']},
  9:{0:['convert():'],1:['print(str(pressure) + "GPaは" + str(pressure * 1000) + "MPaです")'],3:['convert():']},

  11:{1:['minute = str(minute + 30)']},
  12:{1:['total = total + array[i]'],2:['print("平均点は" + str(calculate_average()) + "点です")'],3:['total = total + array[i]','print("平均点は" + str(calculate_average()) + "点です")']},
  13:{0:['print("打ち上げ時刻は5時間後の" + str(int(hours) + "5") + "時" + minutes + "分" + seconds + "秒です")'],2:['print("打ち上げ時刻は5時間後の" + str(hours + 5) + "時" + minutes + "分" + seconds + "秒です")'],3:['print("打ち上げ時刻は5時間後の" + str(hours + "5") + "時" + minutes + "分" + seconds + "秒です")','print("打ち上げ中止パスワードは" + str(hours + minutes + seconds) + "に設定します")']},
  14:{0:['y = str(x) + 4','print("x=" + x + "のときy=" + str(y))'],1:['print("x=" + x + "のときy=" + str(y))'],3:['y = str(x) + 4']},

  17:{0:['def select_price():'],2:['def select_price():','for visitor - visitors:'],3:['for visitor - visitors:']},
  18:{0:['for result = results:'],2:['for result = results:'],3:['print(str(game_num) + "試合中" + str(count_loss(game_results)) + "回敗北しました")']},

  22:{0:['num = math.floor(random.random()) + 1'],1:['total = "0"'],3:['num = math.floor(random.random()) + 1','total = "0"']},
  23:{0:['index = math.floor(random.random() * 2) + 1'],2:['print(text)'],3:['index = math.floor(random.random() * 2) + 1','print(text)']},
  24:{1:['crop_amount = math.floor(random.random()) * 100'],2:['price = reference_price - 100','price = reference_price + 100'],3:['crop_amount = math.floor(random.random()) * 100','price = reference_price - 100']}

/* コードを1行ずつ描画。答えた後は「原因の行」を赤くハイライト。 */
function renderCodeHtml(code, badLines, done){
  const lines = code.split('\n');
  let h = '<pre>';
  lines.forEach(function(ln){
    const isBad = done && badLines.indexOf(ln.trim()) !== -1 && ln.trim() !== '';
    h += '<span class="cline'+(isBad?' bad':'')+'">'+esc(ln)+(isBad?'<span class="mk">  ← ここが原因</span>':'')+'</span>';
  });
  h += '</pre>';
  return h;
}

function render(){
  if(current >= QUIZ.length){ renderFinal(); return; }
  const item = QUIZ[current];
  const isWritten = item.type === 'written';
  const picked = answered[current];
  const done = picked !== null;

  let html = '<div class="card">';
  html += '<div class="qhead"><span class="qno">第' + (current+1) + '問</span>';
  html += '<span class="qtype">' + (isWritten ? '記述式' : '選択式') + '</span></div>';
  html += '<div class="qtext">' + item.q + '</div>';
  if(item.constraint) html += '<div class="qnote">' + item.constraint + '</div>';
  if(item.example) html += '<div class="qexample">【出力例】\n' + esc(item.example) + '</div>';
  if(item.note) html += '<div class="qnote">' + item.note + '</div>';

  if(isWritten){
    html += '<div class="qnote" style="margin-bottom:4px;">問題プログラム：</div>';
    html += '<pre id="givenPre"></pre>';
    html += '<div class="qnote" style="margin:14px 0 4px;">✏️ 解答欄（ここに関数を書いてみよう）：</div>';
    html += '<textarea id="writtenBox" spellcheck="false" placeholder="例）def ...." style="width:100%;min-height:110px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:Consolas,Menlo,monospace;font-size:.9rem;line-height:1.5;resize:vertical;" oninput="writtenAnswer=this.value" onkeydown="tabKey(event,this)"></textarea>';
    if(!done){
      html += '<div style="margin-top:12px;"><button class="reveal-btn" onclick="reveal()">解答例を見る</button></div>';
    }
    html += '<div class="result ' + (done?'show':'') + '" style="margin-top:14px;">';
    html += '<div class="qnote" style="margin-bottom:4px;">解答例（自分の答えと見比べよう）：</div>';
    html += '<pre id="ansPre"></pre>';
    html += buildExplain(item);
    html += '</div>';
  } else {
    item.choices.forEach(function(c,i){
      let cls='choice';
      if(done){
        if(i===picked) cls += c.correct?' correct':' wrong';
        else if(c.correct) cls += ' correct';
      }
      const badLines = (BAD[current] && BAD[current][i]) ? BAD[current][i] : [];
      html += '<button class="'+cls+'" '+(done?'disabled':'')+' onclick="pick('+i+')"><span class="label">'+LABELS[i]+'</span>'+renderCodeHtml(c.code, badLines, done)+'</button>';
      html += '<div class="why '+(c.correct?'ok':'ng')+(done?' show':'')+'">'+c.why+'</div>';
    });
    html += '<div class="result '+(done?'show':'')+'">';
    const ci = item.choices.findIndex(function(c){return c.correct;});
    const right = done && picked===ci;
    html += '<div class="badge '+(right?'ok':'ng')+'">'+(done?(right?'◯ 正解！':'✕ 残念、不正解（正解は'+LABELS[ci]+'）'):'')+'</div>';
    html += buildExplain(item);
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('stage').innerHTML = html;

  // 記述式のコードは textContent で（選択式のコードは renderCodeHtml で描画済み）
  if(isWritten){
    document.getElementById('givenPre').textContent = item.givenCode;
    document.getElementById('writtenBox').value = writtenAnswer;
    if(document.getElementById('ansPre')) document.getElementById('ansPre').textContent = item.answerCode;
  }
  const codes = document.querySelectorAll('#stage .line code');
  item.explainLines.forEach(function(l,i){ if(codes[i]) codes[i].textContent = l[0]; });

  document.getElementById('ptext').textContent = (current+1)+' / '+QUIZ.length+' 問';
  document.getElementById('pbar').style.width = ((current+1)/QUIZ.length*100)+'%';
  document.getElementById('backBtn').disabled = (current===0);
  const nb = document.getElementById('nextBtn');
  nb.disabled = !done;
  nb.textContent = (current===QUIZ.length-1)?'結果を見る →':'次へ →';
  updateJump();
}

function buildExplain(item){
  let h = '<div class="explain"><div class="head">'+item.explainTitle+'</div><div class="lines">';
  item.explainLines.forEach(function(l){
    h += '<div class="line"><code></code><span>'+l[1]+'</span></div>';
  });
  h += '</div></div>';
  if(item.postNote) h += '<div class="postnote">'+item.postNote+'</div>';
  return h;
}

function pick(i){
  if(answered[current]!==null) return;
  answered[current]=i;
  render();
}
function reveal(){
  answered[current]='revealed';
  render();
}
function goNext(){ if(answered[current]===null) return; current++; render(); }
function goBack(){ if(current>0){ current--; render(); } }

function updateJump(){
  const el = document.getElementById('jumpNums');
  let s='';
  for(let i=0;i<QUIZ.length;i++){
    const mark = answered[i]!==null ? '●' : '○';
    const style = i===current ? 'font-weight:800;color:var(--accent);' : 'color:var(--sub);';
    s += '<a href="#" onclick="jumpTo('+i+');return false;" style="text-decoration:none;margin:0 3px;'+style+'">'+(i+1)+'</a>';
  }
  el.innerHTML = s;
}
function jumpTo(i){ current=i; render(); window.scrollTo(0,0); }

function renderFinal(){
  let score=0;
  QUIZ.forEach(function(item,qi){
    if(item.type==='written') return;
    const ci=item.choices.findIndex(function(c){return c.correct;});
    if(answered[qi]===ci) score++;
  });
  document.getElementById('ptext').textContent='結果';
  document.getElementById('pbar').style.width='100%';
  document.getElementById('nav').style.display='none';
  const perfect = score===scoredCount;
  document.getElementById('stage').innerHTML =
    '<div class="card final">'+
    '<div>おつかれさまでした！</div>'+
    '<div class="score">'+score+' / '+scoredCount+' 問 正解</div>'+
    '<div class="msg">'+(perfect?'全問正解！すばらしい🎉':'まちがえた問題は、下の番号や「戻る」で見直せます。')+'<br>（第26問は記述式のため採点には含みません）</div>'+
    '<button class="nav-btn primary" onclick="restart()">もう一度やる</button>'+
    '</div>';
  updateJump();
  document.getElementById('nav').style.display='flex';
  document.getElementById('backBtn').disabled=false;
  document.getElementById('nextBtn').disabled=true;
  document.getElementById('nextBtn').textContent='結果を見る →';
}
function restart(){ writtenAnswer=''; current=0; for(let i=0;i<answered.length;i++) answered[i]=null; render(); window.scrollTo(0,0); }

render();
</script>
